{# Inline SVG icons (decorative: aria-hidden). Presentation attributes only, so the strict CSP holds. #}
{% macro icon(name, cls="icon") -%}
<svg class="{{ cls }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == "logo" -%}
<circle cx="12" cy="6.5" r="3" fill="currentColor" stroke="none"/><circle cx="5.2" cy="8.5" r="2.4" fill="currentColor" stroke="none"/><circle cx="18.8" cy="8.5" r="2.4" fill="currentColor" stroke="none"/><path d="M6.5 21v-3.5a5.5 5.5 0 0 1 11 0V21z" fill="currentColor" stroke="none"/><path d="M1.5 20v-2.6a3.9 3.9 0 0 1 4.6-3.8M22.5 20v-2.6a3.9 3.9 0 0 0-4.6-3.8" stroke-width="2.2"/>
{%- elif name == "home" -%}<path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/>
{%- elif name == "clock" -%}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>
{%- elif name == "list" -%}<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>
{%- elif name == "user" -%}<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>
{%- elif name == "pin" -%}<path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/>
{%- elif name == "briefcase" -%}<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/>
{%- elif name == "star" -%}<path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" fill="currentColor" stroke="none"/>
{%- elif name == "bulb" -%}<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>
{%- elif name == "check" -%}<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/>
{%- elif name == "arrow-left" -%}<path d="M19 12H5M11 6l-6 6 6 6"/>
{%- elif name == "tools" -%}<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/>
{%- elif name == "spark" -%}<path d="M12 3l1.8 4.8L18.5 9.5l-4.7 1.7L12 16l-1.8-4.8L5.5 9.5l4.7-1.7zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>
{%- elif name == "eye" -%}<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
{%- elif name == "shield" -%}<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>
{%- elif name == "send" -%}<path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/>
{%- elif name == "plus" -%}<path d="M12 5v14M5 12h14"/>
{%- elif name == "chevron" -%}<path d="M6 9l6 6 6-6"/>
{%- elif name == "flask" -%}<path d="M9 3h6M10 3v6l-5.5 9.5A1.7 1.7 0 0 0 6 21h12a1.7 1.7 0 0 0 1.5-2.5L14 9V3M7.5 15h9"/>
{%- endif -%}
</svg>
{%- endmacro %}
