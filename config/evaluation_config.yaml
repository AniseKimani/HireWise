# Day 4 recommender/evaluation configuration. Implements the evaluation
# protocol already approved in docs/experimental_design.md Section 15;
# see docs/day4_recommender_report.md for the full write-up.
#
# The master seed and dataset split ratios live in config/data_config.yaml
# and are not duplicated here.

# --- Evaluation protocol ----------------------------------------------------
k: 10
min_candidate_pool_size: 20   # requests with a smaller eligible pool are excluded (Section 15)

relevance_hired_grade: 2
relevance_shortlisted_grade: 1
relevance_none_grade: 0

# --- Content-Based Filtering -------------------------------------------------
# Bounded compatibility score for requests with no stated price
# (pay_type == "unspecified" or price_tier missing).
cbf_price_neutral_score: 0.5

# Predeclared, small weight grid for validation-only tuning (Section 8 of
# the Day 4 brief). Each entry must sum to 1.0. Never edited after seeing
# test results -- see docs/day4_recommender_report.md.
cbf_weight_grid:
  - {skill: 0.60, category: 0.20, price: 0.20}
  - {skill: 0.50, category: 0.25, price: 0.25}
  - {skill: 0.40, category: 0.30, price: 0.30}
  - {skill: 0.34, category: 0.33, price: 0.33}
  - {skill: 0.30, category: 0.50, price: 0.20}
  - {skill: 0.30, category: 0.20, price: 0.50}
  - {skill: 0.70, category: 0.15, price: 0.15}

cbf_tuning_primary_metric: ndcg_at_10
